services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: contract
      POSTGRES_PASSWORD: ${NFC_CONTRACT_DB_PASSWORD:?private process value required}
      POSTGRES_DB: nfc_mobile_contract_test
    ports:
      - '127.0.0.1::5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contract -d nfc_mobile_contract_test']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
