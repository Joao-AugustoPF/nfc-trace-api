name: API checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nfc_trace
          POSTGRES_PASSWORD: nfc_trace_ci
          POSTGRES_DB: nfc_trace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfc_trace -d nfc_trace_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nfc_trace:nfc_trace_ci@localhost:5432/nfc_trace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:all
      - run: npm run build
      - run: npm run openapi
      - run: git diff --exit-code -- docs/openapi.json
